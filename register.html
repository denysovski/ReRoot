<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Create account · Re:Root</title>
<meta name="description" content="Create a free Re:Root account.">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<script>try{var t=JSON.parse(localStorage.getItem('reroot.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="register">
<div id="nav"></div>
<main id="top">
<section class="wrap auth"><form class="glass auth-card" id="register" novalidate>
<div><p class="eyebrow">Free, takes a minute</p><h1 style="margin-top:8px">Create your account</h1><p class="sub" style="margin-top:8px">Then we'll set up your habits together.</p></div>
<div class="field"><label for="r-name">Name or nickname</label><input class="input" id="r-name" autocomplete="nickname" placeholder="Alex"></div>
<div class="field"><label for="r-email">Email</label><input class="input" id="r-email" type="email" autocomplete="email" placeholder="name@example.com"></div>
<div class="field"><label for="r-pass">Password</label><div class="pw-wrap"><input class="input" id="r-pass" type="password" autocomplete="new-password" placeholder="At least 6 characters"><button type="button" data-pw="r-pass">Show</button></div><div class="strength"><i id="r-str"></i></div></div>
<label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)"><input type="checkbox" id="r-terms" style="margin-top:3px;accent-color:currentColor">I agree to the <a href="terms.html">terms</a> and <a href="privacy.html">privacy policy</a>.</label>
<p class="err" id="r-err" hidden></p>
<div class="actions"><button class="btn btn-primary btn-block" data-press type="submit">Create account</button><a class="btn-text" href="login.html">I already have an account</a></div>
<p class="sim-note">This is a simulation. Nothing is sent anywhere, so don't use a password you use elsewhere.</p>
</form></section>
</main>
<div id="footer"></div>
<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(() => { const { $, auth } = RR; document.addEventListener('click', e => { const b = e.target.closest('[data-pw]'); if (!b) return; const i = document.getElementById(b.dataset.pw); i.type = i.type === 'password' ? 'text' : 'password'; b.textContent = i.type === 'password' ? 'Show' : 'Hide'; });
function showErr(id, r) { const el = RR.$(id); el.hidden = false; el.textContent = r.error; const f = { name: 'name', email: 'email', password: 'pass' }[r.field]; }
  if (auth.current()) location.replace('app.html');
  $('#r-pass').addEventListener('input', e => { const v = e.target.value; let s = 0; if (v.length >= 6) s++; if (v.length >= 10) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/[\d\W]/.test(v)) s++; $('#r-str').style.width = (s / 4 * 100) + '%'; });
  $('#register').addEventListener('submit', async e => { e.preventDefault();
    if (!$('#r-terms').checked) { showErr('#r-err', { error: 'Agree to the terms to create an account.' }); return; }
    const r = await auth.register({ name: $('#r-name').value, email: $('#r-email').value, password: $('#r-pass').value });
    if (r.error) { showErr('#r-err', r); ($({ name: '#r-name', email: '#r-email', password: '#r-pass' }[r.field] || '#r-name')).focus(); return; }
    location.href = 'onboarding.html'; }); })();
</script>
</body>
</html>
