<body data-page="app">

  <a href="community.html" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span>Community chats<small>Rooms for every habit</small></span></a>
  <a href="articles.html" role="menuitem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><span>Articles<small>Guides for hard moments</small></span></a>

<button class="corner corner-r glass" id="acct-btn" data-press aria-label="Account, settings and log out">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg>
</button>
<div class="menu" id="acct-menu" hidden>
  <div class="mhead"><b id="m-name"></b><small id="m-email"></small></div>
  <hr>
  <div class="mrow"><span>Theme</span><div class="segm" id="m-theme"><button data-t="light">Light</button><button data-t="dark">Dark</button><button data-t="system">Auto</button></div></div>
  <div class="mrow"><span>Timezone</span><select id="m-tz" aria-label="Timezone"></select></div>
  <div class="mrow"><span>Daily reminder</span><div style="display:flex;gap:10px;align-items:center"><button class="switch" id="m-notif" role="switch" aria-checked="false" aria-label="Daily reminder"></button><input type="time" id="m-time" aria-label="Reminder time" style="height:38px;border:0;border-radius:10px;background:var(--line);padding:0 10px;font-size:14px;flex:1"></div></div>
  <hr>
  <button class="mi" id="m-replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Replay onboarding</button>
  <button class="mi" id="m-reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Delete all my check-ins</button>
  <div id="m-reset-confirm" class="mrow" hidden><span>Delete every habit and check-in? This can't be undone.</span><div style="display:flex;gap:12px;align-items:center"><button class="btn btn-primary btn-sm" id="m-reset-yes">Delete everything</button><button class="btn-text" id="m-reset-no">Keep my data</button></div></div>
  <hr>
  <button class="mi" id="m-logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg><b>Log out</b></button>
</div>

<main class="app-main">
  <section class="view" data-view="home" hidden><div class="wrap" id="home-root"></div></section>
  <section class="view" data-view="today" hidden><div class="wrap" id="today-root"></div></section>
  <section class="view" data-view="progress" hidden><div class="wrap" id="progress-root"></div></section>
  <section class="view" data-view="goals" hidden><div class="wrap" id="goals-root"></div></section>
  <section class="view" data-view="read" hidden><div class="wrap" id="read-root"></div></section>
</main>

<nav class="tabbar" aria-label="App sections">
  <div class="tabs" id="tabs">
    <div class="tab-ind" id="tab-ind"></div>
    <button class="tab" data-press data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="tab" data-press data-nav="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.5L16 9.5"/></svg><span>Today</span></button>
    <button class="tab" data-press data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-6"/></svg><span>Progress</span></button>
    <button class="tab" data-press data-nav="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg><span>Goals</span></button>
    <button class="tab" data-press data-nav="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><span>Read</span></button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab" id="grab" aria-hidden="true"></div>
  <div class="sheet-head" id="sheet-head"><h2 id="sheet-title"></h2>
    <button class="close-x" data-press data-act="close-sheet" aria-label="Close"><svg viewBox="0 0 14 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg></button></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>
