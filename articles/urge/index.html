<noscript><main style="max-width:760px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;line-height:1.6"><h1>Urges rise, peak and pass</h1><p>An urge behaves like a wave. If you don&#x27;t feed it, it fades on its own.</p><article>
    <p>An urge feels like it will keep growing until you give in. It usually doesn't. Urges rise, reach a peak and then fall, often within about 20 to 30 minutes, especially if you don't act on them.</p>
    <p>This practice is often called urge surfing. You ride the wave instead of fighting it or obeying it.</p>
    <ul><li><b>Notice it.</b> Where do you feel it? Hands, chest, stomach, jaw?</li><li><b>Name it.</b> Say to yourself: "This is an urge. It's about a 4 out of 5."</li><li><b>Breathe slowly.</b> Use the 4-4-6 breathing tool in the app for three rounds.</li><li><b>Watch it change.</b> Check the number again. It rarely stays the same.</li></ul>
    <p>If you still want to act, set a 10-minute timer and decide when it ends. Most of the time, the wave has already passed.</p></article><nav aria-label="Pages"><ul><li><a href="">Home</a></li><li><a href="how-it-works">How it works</a></li><li><a href="showcase">Showcase</a></li><li><a href="community">Community</a></li><li><a href="articles">Articles</a></li><li><a href="about">About</a></li><li><a href="faq">FAQ</a></li><li><a href="contact">Contact</a></li><li><a href="register">Create a free account</a></li></ul></nav><p>Re:Root needs JavaScript for the interactive tracker.</p></main></noscript>
