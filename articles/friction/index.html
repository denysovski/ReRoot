<noscript><main style="max-width:760px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;line-height:1.6"><h1>Make the old habit harder to start</h1><p>Small barriers beat willpower. Change your surroundings so the easy path is the clean one.</p><article>
    <p>Willpower runs low when you're tired or stressed. Your environment doesn't. Add friction to the habit and remove it from the alternative.</p>
    <ul><li><b>Nail biting:</b> keep nails short and filed, put a plaster on the finger you bite most, keep a fidget object in your pocket, try a bitter-tasting nail coating.</li><li><b>Late-night phone or porn:</b> charge the phone outside the bedroom, set app limits or content blockers, and avoid being alone in bed with a screen when you're tired.</li><li><b>Smoking or vaping:</b> don't carry them, and change the routine they were attached to, like coffee or the walk to work.</li></ul>
    <p>Each barrier only needs to buy you a few seconds. Those seconds are when you get to choose.</p></article><nav aria-label="Pages"><ul><li><a href="">Home</a></li><li><a href="how-it-works">How it works</a></li><li><a href="showcase">Showcase</a></li><li><a href="community">Community</a></li><li><a href="articles">Articles</a></li><li><a href="about">About</a></li><li><a href="faq">FAQ</a></li><li><a href="contact">Contact</a></li><li><a href="register">Create a free account</a></li></ul></nav><p>Re:Root needs JavaScript for the interactive tracker.</p></main></noscript>
