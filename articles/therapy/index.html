<noscript><main style="max-width:760px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;line-height:1.6"><h1>What to expect from therapy</h1><p>Many people put off getting help because they don&#x27;t know what happens next. Here is a simple overview.</p><article>
    <p>If a habit is affecting your health, work or relationships, a therapist or psychologist can help. Knowing what to expect makes the first step easier.</p>
    <ul><li><b>The first session</b> is mostly a conversation about what is happening, how long it has been going on and what you have already tried.</li><li><b>Common approaches</b> include cognitive behavioural therapy (CBT) and, for habits like nail biting or skin picking, habit reversal training.</li><li><b>Your data helps.</b> Bringing a few weeks of Re:Root check-ins gives your therapist a clear picture from day one.</li></ul>
    <p>You can usually start through your doctor or by contacting a therapist directly. Asking for help is a normal, practical step, not a last resort.</p></article><nav aria-label="Pages"><ul><li><a href="">Home</a></li><li><a href="how-it-works">How it works</a></li><li><a href="showcase">Showcase</a></li><li><a href="community">Community</a></li><li><a href="articles">Articles</a></li><li><a href="about">About</a></li><li><a href="faq">FAQ</a></li><li><a href="contact">Contact</a></li><li><a href="register">Create a free account</a></li></ul></nav><p>Re:Root needs JavaScript for the interactive tracker.</p></main></noscript>
