<noscript><main style="max-width:760px;margin:0 auto;padding:40px 20px;font-family:system-ui,sans-serif;line-height:1.6"><h1>The ten-minute rule</h1><p>You don&#x27;t have to say no forever. Just say &quot;not for the next ten minutes&quot;.</p><article>
    <p>"Never again" is a heavy promise to make in the middle of an urge. "Not for the next ten minutes" is much lighter, and it is usually enough.</p>
    <ul><li>Set a timer for ten minutes the moment you notice the urge.</li><li>Do something with your hands or your body until it rings: wash the dishes, walk around the block, make tea.</li><li>When the timer ends, check in with yourself. If the urge is still there, set another ten minutes.</li></ul>
    <p>Most urges lose much of their strength after two or three rounds. Each time you wait one out, the next one gets a little easier.</p></article><nav aria-label="Pages"><ul><li><a href="">Home</a></li><li><a href="how-it-works">How it works</a></li><li><a href="showcase">Showcase</a></li><li><a href="community">Community</a></li><li><a href="articles">Articles</a></li><li><a href="about">About</a></li><li><a href="faq">FAQ</a></li><li><a href="contact">Contact</a></li><li><a href="register">Create a free account</a></li></ul></nav><p>Re:Root needs JavaScript for the interactive tracker.</p></main></noscript>
