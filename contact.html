<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contact · Re:Root</title>
<meta name="description" content="Contact the Re:Root project.">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<script>try{var t=JSON.parse(localStorage.getItem('reroot.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="contact">
<div id="nav"></div>
<main id="top">
<section class="wrap phead"><p class="eyebrow enter">Contact</p><h1 class="enter" style="--d:.06s">Say hello.</h1><p class="lead enter" style="--d:.12s">Feedback, bugs or ideas for the project. This form is a demo: your message is saved in your browser, not sent.</p></section>
<section class="wrap narrow"><form class="glass auth-card" id="cform" style="width:100%" novalidate>
<div class="field"><label for="c-name">Your name</label><input class="input" id="c-name" autocomplete="name"></div>
<div class="field"><label for="c-email">Email</label><input class="input" id="c-email" type="email" autocomplete="email"></div>
<div class="field"><label for="c-msg">Message</label><textarea class="input" id="c-msg"></textarea></div>
<p class="err" id="c-err" hidden></p>
<div class="actions"><button class="btn btn-primary btn-block" data-press type="submit">Send message</button><a class="btn-text" href="faq.html">Check the FAQ instead</a></div>
<p class="muted" style="font-size:14px">You can also reach the project at <span class="mono" style="user-select:all">hello@reroot.example</span></p></form></section>
</main>
<div id="footer"></div>
<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(() => { const { $, ls, toast } = RR; $('#cform').addEventListener('submit', e => { e.preventDefault();
  const n = $('#c-name').value.trim(), m = $('#c-email').value.trim(), t = $('#c-msg').value.trim(), err = $('#c-err');
  if (!n || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m) || !t) { err.hidden = false; err.textContent = 'Fill in your name, a valid email and a message.'; return; }
  err.hidden = true; const all = ls.get('reroot.messages', []); all.push({ n, m, t, at: Date.now() }); ls.set('reroot.messages', all);
  e.target.reset(); toast('Message saved. This demo doesn\'t send email.'); }); })();
</script>
</body>
</html>
