<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Article · Re:Root</title>
<meta name="description" content="A Re:Root guide.">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<script>try{var t=JSON.parse(localStorage.getItem('reroot.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="articles">
<div id="nav"></div>
<main id="top">
<section class="wrap narrow article" id="article"></section>
<section class="wrap"><div class="sec-head"><h2 style="font-size:32px">Keep reading</h2></div><div class="grid-3" id="more"></div></section>
</main>
<div id="footer"></div>
<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(() => { const { $, esc, glass } = RR, A = window.RR_ARTICLES;
  const id = new URLSearchParams(location.search).get('id'); const a = A.find(x => x.id === id) || A[0];
  document.title = a.t + ' · Re:Root';
  $('#article').innerHTML = `<a class="btn-text" href="articles.html">← All articles</a><p class="eyebrow enter">${esc(a.tag)}</p><h1 class="enter" style="--d:.05s">${esc(a.t)}</h1><p class="deck enter" style="--d:.1s">${esc(a.d)}</p><div class="meta"><span>${a.min} min read</span><span>Re:Root guides</span></div><div class="prose enter" style="--d:.15s">${a.b}</div>
  <div class="glass cta-band" style="margin-top:30px;justify-items:start;text-align:left;padding:32px"><h2 style="font-size:28px">Track it, don't just read it.</h2><div class="actions-row">${RR.auth.current() ? '<a class="btn btn-primary btn-sm" href="app.html#today">Check in for today</a>' : '<a class="btn btn-primary btn-sm" href="register.html">Create free account</a><a class="btn-text" href="login.html">Log in</a>'}</div></div>`;
  $('#more').innerHTML = A.filter(x => x.id !== a.id).slice(0, 3).map(x => `<a class="glass gcard" data-glass href="article.html?id=${x.id}"><span class="tag muted" style="font-size:12.5px">${esc(x.tag)} · ${x.min} min</span><h3>${esc(x.t)}</h3><p>${esc(x.d)}</p></a>`).join('');
  glass(); })();
</script>
</body>
</html>
