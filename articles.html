<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Articles · Re:Root</title>
<meta name="description" content="Short guides from Re:Root on urges, slips, triggers and routines.">
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<script>try{var t=JSON.parse(localStorage.getItem('reroot.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@400..600&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body data-page="articles">
<div id="nav"></div>
<main id="top">

<section class="wrap phead"><p class="eyebrow enter">Articles</p><h1 class="enter" style="--d:.06s">Read when it's hard.</h1>
<p class="lead enter" style="--d:.12s">Short, practical guides for urges, slips and building a new routine. Each one takes two or three minutes.</p></section>
<section class="wrap"><div class="filters" id="filters"></div><div class="grid-3" id="art-grid"></div></section>

</main>
<div id="footer"></div>
<script src="assets/js/core.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(() => { const { $, esc, glass } = RR, A = window.RR_ARTICLES; let tag = 'All';
  const tags = ['All', ...new Set(A.map(a => a.tag))];
  function render() {
    $('#filters').innerHTML = tags.map(t => `<button class="chip" data-press data-tag="${t}" aria-pressed="${t === tag}">${t}</button>`).join('');
    $('#art-grid').innerHTML = A.filter(a => tag === 'All' || a.tag === tag).map(a => `<a class="glass gcard art-card" data-glass href="article.html?id=${a.id}"><span class="tag">${esc(a.tag)} · ${a.min} min read</span><h3>${esc(a.t)}</h3><p>${esc(a.d)}</p><span class="read">Read the guide →</span></a>`).join('');
    glass();
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-tag]'); if (b) { tag = b.dataset.tag; render(); } });
  render(); })();
</script>
</body>
</html>
